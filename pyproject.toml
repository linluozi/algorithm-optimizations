[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-optimizations"
version = "1.0.0"
description = "Four textbook algorithm optimizations, measured on CPython instead of asserted"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "linluozi" }]
keywords = ["benchmark", "cpython", "performance", "algorithms", "teaching"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Education",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/linluozi/algorithm-optimizations"
Repository = "https://github.com/linluozi/algorithm-optimizations"
Issues = "https://github.com/linluozi/algorithm-optimizations/issues"

[project.scripts]
algopt-bench = "algopt.bench:main"

[tool.setuptools]
packages = ["algopt"]
